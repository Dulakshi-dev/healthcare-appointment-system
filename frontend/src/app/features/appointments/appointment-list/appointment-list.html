<div class="page-header">
  <h2>Appointments</h2>
  <a routerLink="/appointments/new" class="btn-primary">+ New Appointment</a>
</div>

<select [(ngModel)]="statusFilter" class="search-box">
  <option value="">All Statuses</option>
  <option value="Scheduled">Scheduled</option>
  <option value="Completed">Completed</option>
  <option value="Cancelled">Cancelled</option>
</select>

<table class="patient-table">
  <thead>
    <tr>
      <th>Patient</th>
      <th>Date</th>
      <th>Time</th>
      <th>Reason</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (appt of filteredAppointments; track appt.id) {
      <tr>
        <td>{{ patientName(appt) }}</td>
        <td>{{ appt.date }}</td>
        <td>{{ appt.time }}</td>
        <td>{{ appt.reason }}</td>
        <td><span class="status-badge" [class]="appt.status.toLowerCase()">{{ appt.status }}</span></td>
        <td>
          <a [routerLink]="['/appointments', appt.id, 'edit']">Edit</a>
          <a [routerLink]="['/appointments', appt.id]">View</a>
          <button (click)="deleteAppointment(appt.id)">Delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>
